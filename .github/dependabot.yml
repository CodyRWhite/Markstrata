# Keeps dependencies current without anyone having to remember.
#
# The markdown and maths libraries are the ones that matter: this project
# started by replacing versions carrying five KaTeX CVEs and a markdown-it
# ReDoS. SPFx packages are grouped and kept on a longer leash because they move
# as a set and a bump there means re-testing the whole build.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # SPFx builds with the TypeScript its own toolchain ships for, which for
      # 1.23 is 5.x, and the version here is pinned exactly rather than
      # floated. TypeScript 7 is the native rewrite and does not work with
      # SPFx at all; the bump Dependabot opened fails CI. A major move here
      # happens when SPFx moves, deliberately, not weekly and not by robot.
      - dependency-name: typescript
        update-types:
          - 'version-update:semver-major'

    groups:
      markdown:
        patterns:
          - 'markdown-it*'
          - 'highlight.js'
          - 'katex'
          - 'mermaid'
      spfx:
        patterns:
          - '@microsoft/*'
          - '@rushstack/*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
