name: Docs site

# Publishes the documentation site to GitHub Pages:
#   /          this project, rendered by its own pipeline
#   /themes/   the kitchen sink document, for judging a theme
#   /app/      the web part's real renderer classes, running in the page
#
# One-off setup: Settings -> Pages -> Source: GitHub Actions. The github-pages
# environment only allows deployments from the default branch unless you add
# others under Settings -> Environments.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: node scripts/build-site.js site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
