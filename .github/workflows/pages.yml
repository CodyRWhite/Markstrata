name: Docs site

# Publishes the documentation site to GitHub Pages:
#   /          this project, rendered by its own pipeline
#   /themes/   the kitchen sink document, for judging a theme
#   /demo/     the web part's real renderer classes, running in the page
#
# The build job enables Pages itself (`enablement: true`) rather than needing
# Settings -> Pages set by hand: the action creates the Pages site through the
# API with the pages: write permission below. Private repositories need a paid
# plan for Pages, and the resulting site is publicly reachable on anything below
# Enterprise Cloud.
#
# The github-pages environment still only allows deployments from the default
# branch unless others are added under Settings -> Environments.
on:
  push:
    branches: [main]
    # The site is not only prose. /demo/ and /themes/ are built by
    # harness/build.js and demo/build-demo.js, which bundle the web part's real
    # renderer classes out of src/ and pull in its stylesheets, so a code change
    # changes the published site and src/ must not be listed here. What is
    # listed is what the site build never reads, checked rather than assumed:
    # the unit tests, the SPFx packaging config, and the Teams app package.
    #
    # An ignore list rather than an allow list, on purpose. If a new input to
    # the site appears and nobody updates this file, an allow list silently
    # stops publishing it and an ignore list merely rebuilds when it did not
    # have to. Only one of those failures is quiet.
    paths-ignore:
      - 'tests/**'
      - 'config/**'
      - 'teams/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/retire.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: node scripts/build-site.js site

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
