name: Release

# Tag a commit to cut a release:
#   node scripts/set-version.js 1.2.0.0
#   git commit -am "Cut 1.2.0.0" && git tag -s v1.2.0.0 -m "Markstrata 1.2.0.0"
#   git push --follow-tags
#
# -s, because a tag cut any other way is lightweight: a bare name on a commit,
# with no signature of its own and nothing for anybody to check. Note that a
# release dispatched from the Actions tab rather than tagged here writes a
# lightweight tag, since the runner has no key to sign with and should not be
# given one. Tag locally when the tag matters.
#
# Versions are four-part, matching what SharePoint compares. A three-part tag
# still works and is treated as build zero.
#
# The tag is the source of truth for the version: it is stamped into
# package.json and config/package-solution.json before the package is built, so
# the .sppkg a tenant installs always reports the version it was released as.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, four-part, without the leading v (e.g. 1.2.0.0)'
        required: true
      recommended:
        description: 'Publish as the recommended download instead of a pre-release. Nothing below 1.0 should be'
        type: boolean
        default: false
      replace:
        description: 'Replace the release if this version already exists, moving its tag to the current commit'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the .sppkg
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Stamp the version
        run: node scripts/set-version.js "${{ steps.version.outputs.version }}"

      - name: Unit tests
        run: npm test

      # The Teams app, built BEFORE the solution package rather than after.
      # package-solution sweeps teams/ into the package, so the zip has to be
      # sitting there by the time it runs. The version it stamps is the one
      # set-version wrote a step earlier.
      #
      # Inside the built .sppkg the file is at ClientSideAssets/TeamsSPFxApp.zip
      # rather than teams/TeamsSPFxApp.zip: SPFx moves what it sweeps. This
      # comment used to claim the second path, from documentation rather than
      # from looking, and the package says otherwise. What is actually known is
      # that building it into teams/ before packaging produces a package that
      # Sync to Teams accepts, because 0.0.18.4 did and a tenant confirmed it.
      # The check below is there so that if it ever stops being swept in, the
      # release fails here rather than a tenant finding out.
      #
      # Built, but not published beside the .sppkg. It used to be a second
      # release asset, from when Sync to Teams was failing and the only way in
      # was to upload the zip to the Teams admin centre by hand. Sync works, so
      # the zip that matters is the one inside the package: a second copy on the
      # release is a version of the app that can be installed without the
      # SharePoint side it talks to, and drifts the moment anybody uses it.
      - name: Build the Teams app package
        id: teams
        run: |
          npm run teams
          # Both of them. The solution ships two web parts and a Teams manifest
          # allows one configurable tab, so there are two apps: the markdown
          # one, which Sync to Teams deploys because it is inside the .sppkg,
          # and the HTML one, which is not and has to be uploaded by hand. The
          # second is the one that can only come from here, and it was the one
          # missing: this step was written when there was a single app and
          # nothing failed when a second appeared beside it.
          test -f teams/TeamsSPFxApp.zip
          test -f teams/MarkstrataHtmlTeamsApp.zip
          # Attached to a pre-release and to nothing else. It is the only way
          # to test the Teams half on its own, which is what it was needed for
          # the day Sync to Teams refused the app and SharePoint reported
          # nothing useful. On a recommended release it is a liability: a Teams
          # app that installs without the SharePoint half it talks to, and that
          # goes stale in a tenant that keeps an old copy.
          #
          # Two paths in one value, split by the shell where they are used. The
          # names carry no spaces, which is what makes that safe, and a test
          # above would have failed already if either were missing.
          if [ "${{ inputs.recommended }}" != "true" ]; then
            echo "path=teams/TeamsSPFxApp.zip teams/MarkstrataHtmlTeamsApp.zip" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the solution package
        run: npm run package

      # The asset keeps one name for every release. The App Catalog matches an
      # upload to the solution it replaces by FILE NAME, so a version in the
      # name means the upload is refused: "A solution with the same product ID
      # already exists. Please upload the file with the same name and replace
      # the existing solution." The version is in the tag, the release title,
      # and inside the package itself, which is where SharePoint reads it.
      - name: Check the package was built
        id: package
        run: |
          PATH_TO_PACKAGE=sharepoint/solution/markstrata.sppkg
          test -f "$PATH_TO_PACKAGE"

          # And that it carries the Teams app. Without this the package still
          # builds, still installs, and Sync to Teams either does nothing or
          # deploys something SPFx generated - which is the failure that cost
          # an evening once already, and it is silent from the outside.
          if ! unzip -l "$PATH_TO_PACKAGE" | grep -q 'TeamsSPFxApp.zip'; then
            echo "The Teams app is not in the package. Sync to Teams would have"
            echo "nothing to deploy. Check that npm run teams ran before"
            echo "package-solution and wrote into teams/."
            exit 1
          fi

          echo "path=$PATH_TO_PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ steps.package.outputs.path }}
          TEAMS: ${{ steps.teams.outputs.path }}
          # The solution version stays four-part numeric either way: SharePoint
          # will not install a package whose version carries a semver suffix, so
          # a pre-release is marked on the GitHub release, not in the number.
          # Pre-release unless somebody deliberately says otherwise, and a tag
          # push says nothing at all: inputs are empty there. It read the other
          # way round until now, so 0.0.17.0, 0.0.17.1 and 0.0.17.2 were
          # published as the recommended download by a tag push, which is not
          # a thing this project has ever meant to do. Nothing below 1.0 is
          # recommended, and the default should not be the answer that needs
          # undoing.
          PRERELEASE: ${{ inputs.recommended && '' || '--prerelease' }}
          REPLACE: ${{ inputs.replace }}
        run: |
          NOTES=$(node scripts/release-notes.js "$VERSION")
          # An existing release keeps its tag where it is, so re-running a
          # version after the history moved would leave the tag on a commit
          # that is no longer on the branch. --cleanup-tag drops both, and the
          # create below re-tags whatever this run checked out.
          if [ "$REPLACE" = "true" ] && gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release delete "v$VERSION" --yes --cleanup-tag
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$PACKAGE" $TEAMS --clobber
          else
            # --target, because without it gh tags the repository's DEFAULT
            # branch rather than the commit this run built. Every 0.0.18.x tag
            # was created that way: the package inside each one is built from
            # the branch it was dispatched on, and the tag beside it points at
            # a commit holding none of that code. A tag that names the wrong
            # commit is worse than no tag - it answers "what shipped?" with a
            # straight face and gets it wrong, and bisecting or checking one
            # out gives you a build nobody released.
            gh release create "v$VERSION" "$PACKAGE" $TEAMS \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --notes "$NOTES" \
              $PRERELEASE
          fi
