name: Release

# Tag a commit to cut a release:
#   node scripts/set-version.js 1.2.0.0
#   git commit -am "Cut 1.2.0.0" && git tag v1.2.0.0 && git push --follow-tags
#
# Versions are four-part, matching what SharePoint compares. A three-part tag
# still works and is treated as build zero.
#
# The tag is the source of truth for the version: it is stamped into
# package.json and config/package-solution.json before the package is built, so
# the .sppkg a tenant installs always reports the version it was released as.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, four-part, without the leading v (e.g. 1.2.0.0)'
        required: true
      prerelease:
        description: 'Publish as a pre-release, for testing before it is the recommended download'
        type: boolean
        default: false
      replace:
        description: 'Replace the release if this version already exists, moving its tag to the current commit'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the .sppkg
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Stamp the version
        run: node scripts/set-version.js "${{ steps.version.outputs.version }}"

      - name: Unit tests
        run: npm test

      # The Teams app, built BEFORE the solution package rather than after.
      # SharePoint looks inside the .sppkg for ./teams/TeamsSPFxApp.zip when an
      # administrator presses Sync to Teams, and deploys that instead of
      # generating a manifest of its own - so it has to be sitting in teams/ by
      # the time package-solution sweeps that folder up. The version it stamps
      # is the one set-version wrote a step earlier.
      #
      # Built, but not published beside the .sppkg. It used to be a second
      # release asset, from when Sync to Teams was failing and the only way in
      # was to upload the zip to the Teams admin centre by hand. Sync works, so
      # the zip that matters is the one inside the package: a second copy on the
      # release is a version of the app that can be installed without the
      # SharePoint side it talks to, and drifts the moment anybody uses it.
      - name: Build the Teams app package
        run: |
          npm run teams
          test -f teams/TeamsSPFxApp.zip

      - name: Build the solution package
        run: npm run package

      # The asset keeps one name for every release. The App Catalog matches an
      # upload to the solution it replaces by FILE NAME, so a version in the
      # name means the upload is refused: "A solution with the same product ID
      # already exists. Please upload the file with the same name and replace
      # the existing solution." The version is in the tag, the release title,
      # and inside the package itself, which is where SharePoint reads it.
      - name: Check the package was built
        id: package
        run: |
          PATH_TO_PACKAGE=sharepoint/solution/markstrata.sppkg
          test -f "$PATH_TO_PACKAGE"
          echo "path=$PATH_TO_PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ steps.package.outputs.path }}
          # The solution version stays four-part numeric either way: SharePoint
          # will not install a package whose version carries a semver suffix, so
          # a pre-release is marked on the GitHub release, not in the number.
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
          REPLACE: ${{ inputs.replace }}
        run: |
          NOTES=$(node scripts/release-notes.js "$VERSION")
          # An existing release keeps its tag where it is, so re-running a
          # version after the history moved would leave the tag on a commit
          # that is no longer on the branch. --cleanup-tag drops both, and the
          # create below re-tags whatever this run checked out.
          if [ "$REPLACE" = "true" ] && gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release delete "v$VERSION" --yes --cleanup-tag
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$PACKAGE" --clobber
          else
            # --target, because without it gh tags the repository's DEFAULT
            # branch rather than the commit this run built. Every 0.0.18.x tag
            # was created that way: the package inside each one is built from
            # the branch it was dispatched on, and the tag beside it points at
            # a commit holding none of that code. A tag that names the wrong
            # commit is worse than no tag - it answers "what shipped?" with a
            # straight face and gets it wrong, and bisecting or checking one
            # out gives you a build nobody released.
            gh release create "v$VERSION" "$PACKAGE" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --notes "$NOTES" \
              $PRERELEASE
          fi
