name: CI

on:
  # main only, and that is the whole saving. A branch push and the pull request
  # opened from it are two events for one commit, so every commit on the way to
  # a merge was linted, tested, packaged and driven through a browser twice: the
  # runs were not merely similar, they were the same SHA. The pull_request
  # trigger below is the one that gates a merge, so the branch push is the copy
  # to drop. A branch with no pull request open is not covered until one is,
  # which is the moment anybody else has to care about it.
  #
  # archive/** needed excluding when every branch was built. It no longer is.
  push:
    branches: [main]
  # Deliberately unfiltered. A path filter here would skip the run, and a
  # skipped run is not a passed one: where a check is required, the pull request
  # waits for something that is never coming. The site's own documentation is
  # also not free of code as far as these tests are concerned - tests/site,
  # tests/brand and tests/sample-data all read docs/ and assets/, and the last
  # of those is what keeps a real tenant's host out of the repository - so a
  # docs-only change is a change these tests have an opinion about.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build the solution package
        run: npm run package

      - name: Check the package was produced
        run: |
          test -f sharepoint/solution/markstrata.sppkg
          ls -lh sharepoint/solution/markstrata.sppkg

      # Handy for testing a branch in a tenant without building locally.
      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: markstrata-${{ github.sha }}
          path: sharepoint/solution/markstrata.sppkg
          retention-days: 14

  browser:
    name: Drive the web part in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright is not a dependency of the project: only this job needs it.
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      # SPFx has no local workbench any more, so this runs the renderer classes
      # in a real browser instead: toolbar, contents, copy, theme switching,
      # diagrams and the live preview.
      - name: Drive the harness
        run: npm run harness:drive
