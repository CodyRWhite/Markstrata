name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build the solution package
        run: npm run package

      - name: Check the package was produced
        run: |
          test -f sharepoint/solution/markdown-formatter-spo.sppkg
          ls -lh sharepoint/solution/markdown-formatter-spo.sppkg

      # Handy for testing a branch in a tenant without building locally.
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: markdown-formatter-spo-${{ github.sha }}
          path: sharepoint/solution/markdown-formatter-spo.sppkg
          retention-days: 14
