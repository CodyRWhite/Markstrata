name: Restore tags

# Recreates every tag listed in .github/tags.tsv, then drops the branch that
# was only there to carry objects no other branch reached.
#
# This exists because the repository was moved after its history was rewritten,
# and the sandbox that holds the rewritten clone cannot push a tag: the git
# remote answers every tag ref and every ref deletion with a bare 403, and the
# REST git/refs endpoint is refused as well. Inside Actions the token is the
# repository's own and neither restriction applies.
#
# Tags pushed with GITHUB_TOKEN do not start new workflow runs, so this does not
# set off thirty-three releases on its way past. That is GitHub's rule, not a
# trick, and it is the reason this is safe to run in one go.
#
# One shot. Delete this file, and .github/tags.tsv with it, once the tags are
# up.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    name: Recreate the tags
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # checkout brings the dispatched branch's history. The v1.0.x line is on
      # no branch but archive/v1.0, so everything has to be in hand before a
      # tag can name a commit on it.
      - name: Fetch every branch
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Recreate the tags
        run: |
          MISSING=0
          while IFS=$'\t' read -r TAG SHA; do
            [ -n "$TAG" ] || continue
            if ! git cat-file -e "$SHA^{commit}" 2>/dev/null; then
              echo "::error::$TAG names $SHA, which is not in this repository"
              MISSING=1
              continue
            fi
            git tag -f "$TAG" "$SHA"
            echo "tagged $TAG -> $SHA"
          done < .github/tags.tsv
          # A tag pointing nowhere is worse than a missing one, so nothing is
          # pushed if any line did not resolve.
          [ "$MISSING" = "0" ] || exit 1
          git push origin --tags
          echo "pushed $(git tag | wc -l) tags"

      - name: Drop the carrier branch
        run: |
          if git ls-remote --exit-code --heads origin archive/v1.0 >/dev/null 2>&1; then
            git push origin --delete archive/v1.0
            echo "deleted archive/v1.0; the v1.0.x commits are held by their tags now"
          fi
